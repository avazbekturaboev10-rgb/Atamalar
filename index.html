Unitar davlat||Yagona davlat bo‘lib, uning alohida ma’muriy-hududiy birliklari bir xildagi huquqlarga ega, butun davlat hududida yagona konstitutsiya, yagona hukumat va yagona qonun hujjatlari amal qiladi.
